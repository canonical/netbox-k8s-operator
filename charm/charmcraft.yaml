# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/ for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: netbox-k8s

type: charm

base: ubuntu@26.04
charm-user: non-root

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A very short one-line summary of the Django application.

# (Required)
description: |
  A comprehensive overview of your Django application.

extensions:
  - django-framework
requires:
  postgresql:
    interface: postgresql_client
    limit: 1
  s3:
    interface: s3
    limit: 1
  redis:
    interface: redis
    limit: 1
  saml:
    interface: saml
    limit: 1
    optional: true
  oidc:
    interface: oauth
    optional: true
    limit: 1
  certificates:
    interface: tls-certificates
    optional: true
    limit: 1

parts:
  cryptography-build-deps:
    plugin: nil
    build-packages:
      - libssl-dev
      - pkg-config
  icon:
    plugin: dump
    source: .
    stage:
      - icon.svg
