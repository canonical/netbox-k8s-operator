name: netbox-k8s

type: charm

base: ubuntu@26.04
charm-user: non-root

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A very short one-line summary of the Django application.

# (Required)
description: |
  A comprehensive overview of your Django application.

extensions:
  - django-framework

charm-libs:
  - lib: tls_certificates_interface.tls_certificates
    version: '4'

requires:
  postgresql:
    interface: postgresql_client
    limit: 1
  s3:
    interface: s3
    limit: 1
  valkey:
    interface: valkey_client
    limit: 1
  saml:
    interface: saml
    limit: 1
    optional: true
  oidc:
    interface: oauth
    optional: true
    limit: 1
  certificates:
    interface: tls-certificates
    optional: true
    limit: 1

config:
  options:
    oidc-redirect-path:
      type: string
      description: The path that the user will be redirected upon completing login.
      default: /oauth/complete/oidc/
    oidc-scopes:
      type: string
      description: List of scopes separated by spaces.
      default: "openid profile email"
    oidc-groups-claim:
      type: string
      description: OIDC claim containing the list of groups to synchronize. Empty disables synchronization.
      default: ""
    oidc-superuser-groups:
      type: string
      description: Comma-separated OIDC groups whose members receive NetBox superuser access.
      default: ""
    oidc-staff-groups:
      type: string
      description: Comma-separated OIDC groups whose members receive NetBox staff access.
      default: ""

parts:
  cryptography-build-deps:
    plugin: nil
    build-packages:
      - libssl-dev
      - pkg-config
  icon:
    plugin: dump
    source: .
    stage:
      - icon.svg
