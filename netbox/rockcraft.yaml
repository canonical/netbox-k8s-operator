# See https://documentation.ubuntu.com/rockcraft/latest/reference/extensions/django-framework
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: netbox
# see https://documentation.ubuntu.com/rockcraft/latest/explanation/bases/
# for more information about bases and using 'bare' bases for chiselled rocks
base: ubuntu@26.04 # build-base is required when the base is bare
version: "4.6.5" # just for humans. Semantic versioning is recommended
summary: A summary of your Django application # 79 char long summary
description: |
  This is netbox's description. You have a paragraph or two to tell the
  most important story about it. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the
  container registries out there.
# the platforms this rock should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:

extensions:
  - django-framework

parts:
  django-framework.dependencies:
    build-packages:
      - pkg-config
      - libxmlsec1-dev
      - libpq-dev
    stage-packages:
      # needed for saml (ubuntu@26.04 ships SONAME-versioned packages)
      - libxmlsec1-1
      - libxmlsec1-openssl1
      # needed for postgresql (psycopg[c])
      - libpq5
    # The django-framework extension's own override-build must run (it writes
    # the .gunicorn-constraints.txt file consumed by the python plugin), so
    # drop pyproject.toml from the pulled source tree instead of overriding
    # build. Without this the python plugin would also `pip install .` the
    # NetBox source tree itself.
    override-pull: |-
      craftctl default
      rm -f pyproject.toml
    python-requirements:
      - requirements.txt
    stage:
      # Avoid conflict with the ca-certificates.crt provided by the
      # django-framework/runtime part.
      - -etc/ssl/certs/ca-certificates.crt
  cron:
    stage-packages:
      - cron
    plugin: nil

  cron-tasks:
    plugin: dump
    source: cron.d
    organize:
      housekeeping: etc/cron.d/housekeeping
      syncdatasource: etc/cron.d/syncdatasource
    permissions:
      - mode: "644"

  netbox-post-process:
    after:
      - django-framework.dependencies
      - django-framework.install-app
    plugin: nil
    override-prime: |-
      # At this point, the original configuration does not work correctly.
      # Some missing env vars like DJANGO_SECRET_KEY...
      NETBOX_CONFIGURATION=netbox.configuration_testing PYTHONUSERBASE=${CRAFT_PRIME} python3 ${CRAFT_PRIME}/app/manage.py collectstatic --no-input
      # Reports and scripts are written by the _daemon_ user.
      chown 584792:584792 app/reports
      chown 584792:584792 app/scripts

services:
  # With the scheduler prefix it will just run in one unit
  cron-scheduler:
    override: merge
    summary: "Cron Service"
    command: "/usr/sbin/cron -f"
    startup: enabled
  netbox-rq-worker:
    override: merge
    summary: "NetBox Request Queue Worker"
    command: "/bin/python3 manage.py rqworker high default low"
    startup: enabled
    user: _daemon_
    working-dir: /app
