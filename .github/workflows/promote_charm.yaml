name: Promote charm

on:
  workflow_dispatch:
    inputs:
      origin-channel:
        type: choice
        description: "Origin Channel"
        options:
          - 4/edge
          - 4.7/edge
      destination-channel:
        type: choice
        description: "Destination Channel"
        options:
          - 4/stable
          - 4.7/stable
    secrets:
      CHARMHUB_TOKEN:
        required: true

jobs:
  validate-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Check that both channels are in the same track
        env:
          ORIGIN: ${{ github.event.inputs.origin-channel }}
          DESTINATION: ${{ github.event.inputs.destination-channel }}
        run: |
          if [ "${ORIGIN%%/*}" != "${DESTINATION%%/*}" ]; then
            echo "Cannot promote from ${ORIGIN} to ${DESTINATION}: the tracks differ."
            exit 1
          fi
  promote-charm:
    needs: validate-tracks
    uses: canonical/operator-workflows/.github/workflows/promote_charm.yaml@main
    with:
      origin-channel: ${{ github.event.inputs.origin-channel }}
      destination-channel: ${{ github.event.inputs.destination-channel }}
      doc-automation-disabled: false
    secrets: inherit
